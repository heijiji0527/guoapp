name: Publish release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '包含构建产物的 Actions run id'
        required: true
      tag:
        description: 'Release 标签'
        required: true
        default: 'v0.2.55'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download android artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Collect packages
        run: |
          find dist \( -name '*.apk' -o -name '*-windows-x64.zip' -o -name '*-ios*' \) -exec mv {} . \;
          ls -la *.apk *.zip *.ipa 2>/dev/null || true
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" -R wuquan0527/guoapp \
            --title "真果鉴/红果鉴 ${{ inputs.tag }} 预览版（debug 签名）" \
            --notes "Android 预览 APK（arm64-v8a 主流手机 / armeabi-v7a 旧设备 / x86_64 模拟器）、Windows x64 便携压缩包、iOS 未签名 IPA。未配置正式签名，安装时可能提示未知来源。" || true
          gh release upload "${{ inputs.tag }}" -R wuquan0527/guoapp *.apk --clobber
          gh release upload "${{ inputs.tag }}" -R wuquan0527/guoapp *.zip *.ipa --clobber || true
